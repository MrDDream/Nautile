# Nautile Desktop (Windows, Linux, later macOS): a separate app that speaks the Android app's formats.
[workspace]
resolver = "2"
members = ["crates/nautile-core", "crates/nautile-net", "crates/nautile-app"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# SQLCipher with OpenSSL built from source: same encrypted database on Windows and Linux.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }

# Smaller executables: no debug symbols, whole-program optimisation.
[profile.release]
strip = true
lto = "thin"
