[package]
name = "nautile-app"
description = "Nautile Desktop: SSH, Mosh, Telnet, SFTP, RDP and VNC client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nautile"
path = "src/main.rs"

[dependencies]
nautile-core = { path = "../nautile-core" }
iced = { version = "0.14", features = ["advanced", "tokio"] }
rfd = "0.18"
dirs = "7"
keyring = "4"
tokio = { version = "1", features = ["time", "rt"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
hex.workspace = true

[dev-dependencies]
iced_test = "0.14"
