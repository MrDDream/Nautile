[package]
name = "nautile-app"
description = "Nautile Desktop: SSH, Mosh, Telnet, SFTP, RDP and VNC client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nautile"
path = "src/main.rs"

[dependencies]
nautile-core = { path = "../nautile-core" }
nautile-net = { path = "../nautile-net" }
alacritty_terminal = "0.26"
# CPU rendering (tiny-skia) only: ~30 MB of RAM instead of ~160 MB with wgpu, no Vulkan/GL needed.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11", "wayland", "advanced", "tokio"] }
rfd = "0.18"
dirs = "7"
keyring = "4"
tokio = { version = "1", features = ["time", "rt"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
hex.workspace = true

[dev-dependencies]
iced_test = "0.14"
