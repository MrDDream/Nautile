# cargo about: the licences of the crates built into Nautile Desktop, written into
# packaging/THIRD-PARTY-LICENSES.txt by `scripts/gen-licenses.py desktop` (template: packaging/licenses/about.hbs).
accepted = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "blessing",
    "WTFPL",
    "OpenSSL",
]
# Only what ends up in the executable.
ignore-build-dependencies = false
ignore-dev-dependencies = true
# Crates marked `publish = false` are skipped (ours are listed under GPL-3.0-or-later, see LICENSE).
private = { ignore = true }
