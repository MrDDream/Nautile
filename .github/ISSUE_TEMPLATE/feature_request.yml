name: Feature request
description: An idea to make Nautile better
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The need first, the solution second. / Le besoin d'abord, la solution ensuite.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or other apps that do it
