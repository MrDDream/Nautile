version: 2
updates:
  # Android app (gradle/libs.versions.toml). After an update, regenerate gradle/verification-metadata.xml:
  # ./gradlew --write-verification-metadata sha256 testDebugUnitTest lintDebug assembleDebug assembleRelease
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]

  # Desktop app (desktop/Cargo.toml, Cargo.lock).
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      iced:
        patterns: ["iced*"]
      ironrdp:
        patterns: ["ironrdp*"]

  # Actions pinned by commit in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
