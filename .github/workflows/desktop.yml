name: Desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", "core/i18n/translations/**", ".github/workflows/desktop.yml", "LICENSE"]
  pull_request:
    paths: ["desktop/**", "core/i18n/translations/**", ".github/workflows/desktop.yml", "LICENSE"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (including the Android compatibility files)
        run: cargo test --all
      - name: Release build (to try the app)
        run: cargo build --release -p nautile-app
      - name: Packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Packages
        shell: bash
        run: packaging/package.sh
      - uses: actions/upload-artifact@v5
        with:
          name: nautile-desktop-${{ runner.os }}
          path: desktop/dist/*
          retention-days: 14
