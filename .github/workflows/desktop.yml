name: Desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", "core/i18n/translations/**", ".github/workflows/desktop.yml", "LICENSE", "third_party/NOTICE.md"]
  pull_request:
    paths: ["desktop/**", "core/i18n/translations/**", ".github/workflows/desktop.yml", "LICENSE", "third_party/NOTICE.md"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (including the Android compatibility files)
        run: cargo test --all --locked
      - name: Release build (to try the app)
        run: cargo build --release --locked -p nautile-app
      - name: Packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: choco install nsis --version 3.13.0 -y --no-progress
      - name: Packages
        shell: bash
        run: packaging/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nautile-desktop-${{ runner.os }}
          path: desktop/dist/*
          retention-days: 14

  # Known vulnerabilities (RustSec), licences, duplicate or unknown sources: desktop/deny.toml.
  deny:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        run: cargo deny --locked check
