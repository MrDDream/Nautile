name: Release

# Pushing a tag vX.Y.Z (equal to versionName and to the desktop version) builds the signed APKs and the
# desktop packages (Windows installer and portable zip, .deb, .rpm, .tar.gz) and attaches them to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Check that the tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION" >&2
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAUTILE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nautile-release.jks"

      - name: Tests and signed release APKs
        env:
          NAUTILE_STORE_FILE: ${{ runner.temp }}/nautile-release.jks
          NAUTILE_STORE_PASSWORD: ${{ secrets.NAUTILE_STORE_PASSWORD }}
          NAUTILE_KEY_ALIAS: ${{ secrets.NAUTILE_KEY_ALIAS }}
          NAUTILE_KEY_PASSWORD: ${{ secrets.NAUTILE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          mkdir dist
          for f in app/build/outputs/apk/release/*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^Nautile-v[^-]+-(.*)-release\.apk$/\1/')
            if [ "$abi" = "universal" ]; then cp "$f" "dist/Nautile-$GITHUB_REF_NAME.apk"; else cp "$f" "dist/Nautile-$GITHUB_REF_NAME-$abi.apk"; fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Signing certificate
        id: cert
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "dist/Nautile-$GITHUB_REF_NAME.apk" | grep -oP 'SHA-256 digest: \K[0-9a-f]+')
          echo "sha256=$CERT" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT: ${{ steps.cert.outputs.sha256 }}
        run: |
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          {
            cat "fastlane/metadata/android/en-US/changelogs/$CODE.txt" 2>/dev/null || true
            echo
            echo "---"
            echo
            cat "fastlane/metadata/android/fr-FR/changelogs/$CODE.txt" 2>/dev/null || true
            echo
            echo "---"
            echo
            echo "**Which APK?** \`arm64-v8a\` for almost every recent phone, \`armeabi-v7a\` for older 32-bit phones, the universal one if unsure."
            echo
            echo "**Package:** \`com.nautile\` · **Signing certificate SHA-256:** \`$CERT\`"
            echo
            echo "**Desktop:** \`Nautile-*-setup.exe\` (Windows, no administrator rights needed), \`Nautile-*-portable.zip\` (Windows, everything stays in its folder), \`.deb\` (Debian, Ubuntu), \`.rpm\` (Fedora, openSUSE), \`.tar.gz\` (other Linux). The Windows files are not signed yet: SmartScreen shows « Windows protected your PC » → *More info* → *Run anyway*."
          } > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Nautile $GITHUB_REF_NAME" --notes-file notes.md
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nautile-release.jks"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Check that the tag matches the desktop version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the desktop version $VERSION" >&2
            exit 1
          fi
      - name: Packaging tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Tests, release build and packages
        run: |
          cargo test --all
          cargo build --release -p nautile-app
          packaging/package.sh
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ runner.os }}
          path: desktop/dist/*

  publish-desktop:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Attach the desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS-desktop.txt && cat SHA256SUMS-desktop.txt)
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
